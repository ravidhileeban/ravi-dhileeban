name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queued runs supersede older ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production, GitHub Pages base href)
        run: npm run build:gh-pages

      - name: Prepare Pages artifact
        run: |
          # SPA fallback so deep links and refreshes resolve to the app shell.
          cp dist/ravi-dhileeban/browser/index.html dist/ravi-dhileeban/browser/404.html
          # Stop GitHub Pages running the output through Jekyll.
          touch dist/ravi-dhileeban/browser/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ravi-dhileeban/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
